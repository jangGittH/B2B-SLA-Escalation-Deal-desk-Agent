services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar-local
      POSTGRES_DB: northstar
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - northstar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  northstar-db:
